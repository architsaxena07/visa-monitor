name: Daily Summary

on:
  schedule:
    - cron: '30 15 * * *'   # 9:00 PM IST every day
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python daily_summary.py
